name: quality

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    environment: Testing
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      # Vite 8 / Tailwind 4 need a current Node; ubuntu-latest's default is not pinned.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist
          npm ci --no-audit --no-fund

      # Composer was installed with --no-scripts, so package discovery and the
      # application key have to be prepared explicitly before anything boots.
      - name: Prepare Application
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
          php artisan package:discover --ansi
          php artisan config:clear

      # `composer lint` used to *fix* files in CI, which could never fail a build.
      - name: Check Code Style
        run: composer lint:check

      # This repository deliberately ignores /tests and /phpunit.xml ("tests are
      # for local development only"), so a fresh checkout has no suite to run.
      # `composer test` remains the local QA command; CI instead proves the app
      # boots and every Blade template compiles. See AI-SUGGESTIONS.md section 9.
      - name: Compile All Blade Views
        run: php artisan view:cache
        env:
          AI_SUGGESTIONS_ENABLED: 'false'
          AI_SUGGESTIONS_KEY: ''

      - name: Build Frontend Assets
        run: npm run build
